<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<meta name="description" content="DENLOGO">
<title>DENLOGO</title>
<style>
:root{--bg:#08090a;--metal1:#5d5652;--metal2:#eee1d7;--metal3:#9d8c80;--violet:#ea6cff;--amber:#ff9a3c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg)}
body{overflow:hidden;color:#f3eee9;font-family:Georgia,"Times New Roman",serif}
.page{
  position:relative;min-height:100svh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  background:
    radial-gradient(60% 55% at 52% 35%,rgba(255,255,255,.035),transparent 65%),
    linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 23%,
      rgba(255,255,255,.025) 23% 23.1%,transparent 23.1% 76%,
      rgba(255,255,255,.022) 76% 76.1%,transparent 76.1%),
    linear-gradient(180deg,#0b0c0e,#070809 78%);
  isolation:isolate;
}
.page:before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:
    linear-gradient(90deg,transparent 0 86.2%,rgba(255,145,55,.04) 90%,
      rgba(255,161,74,.18) 92.5%,rgba(255,190,105,.9) 93%,
      rgba(255,120,36,.2) 93.25%,transparent 94.2%),
    radial-gradient(36% 34% at 91% 78%,rgba(255,142,58,.12),transparent 72%);
}
.page:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:28vh;z-index:-1;
  border-top:1px solid rgba(255,255,255,.025);
  background:
    linear-gradient(180deg,rgba(20,21,22,.14),rgba(4,5,6,.88)),
    radial-gradient(22% 75% at 91% 0%,rgba(255,151,61,.13),transparent 72%);
}
.corner{
  position:absolute;top:3.2rem;left:5.3vw;
  letter-spacing:.46em;text-indent:.46em;font-size:clamp(1rem,1.6vw,1.8rem);
  font-weight:500;text-transform:uppercase;white-space:nowrap;
}
.hero{display:flex;flex-direction:column;align-items:center;transform:translateY(-1.5vh)}
.mark{
  position:relative;width:clamp(190px,25vw,370px);height:clamp(190px,25vw,370px);
  margin-bottom:-1.8rem;filter:drop-shadow(0 16px 28px rgba(0,0,0,.52));
}
.mark span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:Bodoni MT,Didot,Georgia,serif;font-weight:700;line-height:.78;
  color:transparent;
  background:linear-gradient(103deg,#514945 0%,#f6e4d7 17%,#82766f 34%,#fff6ef 48%,#8b7b72 65%,#ead0be 82%,#514743 100%);
  -webkit-background-clip:text;background-clip:text;
  text-shadow:0 1px 0 rgba(255,255,255,.12);
}
.mark .d{font-size:clamp(12rem,26vw,24rem);transform:translateX(-5%)}
.mark .l{font-size:clamp(11rem,24vw,22rem);transform:translate(11%,8%)}
.name{
  margin:.15rem 0 4.8rem;
  font-size:clamp(1.6rem,3.1vw,3.2rem);
  letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
  font-weight:500;text-shadow:0 2px 18px rgba(255,171,110,.08);
}
.cta{
  display:inline-flex;align-items:center;gap:1.9rem;
  min-width:clamp(220px,20vw,310px);justify-content:center;
  padding:1.1rem 1.8rem;border:1px solid #dc57ff;border-radius:8px;
  color:#ef8eff;text-decoration:none;
  font-family:Arial,Helvetica,sans-serif;font-size:.84rem;font-weight:700;
  letter-spacing:.25em;text-transform:uppercase;
  box-shadow:0 0 0 1px rgba(220,87,255,.06),0 0 20px rgba(220,87,255,.08);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.cta:hover,.cta:focus-visible{transform:translateY(-2px);box-shadow:0 0 24px rgba(220,87,255,.22);background:rgba(220,87,255,.035);outline:none}
.arrow{font-size:1.45rem;line-height:1}
@media(max-width:700px){
  .corner{top:1.8rem;left:7vw;font-size:.95rem;letter-spacing:.34em;text-indent:.34em}
  .hero{transform:translateY(-1vh);padding:0 1.25rem}
  .mark{width:220px;height:220px;margin-bottom:-.9rem}
  .mark .d{font-size:12.4rem}.mark .l{font-size:11.4rem}
  .name{font-size:1.55rem;letter-spacing:.29em;text-indent:.29em;margin-bottom:3.4rem}
  .cta{min-width:230px;padding:1rem 1.35rem;gap:1.2rem;font-size:.77rem}
}
</style>
</head>
<body>
<main class="page" aria-label="DENLOGO">
  <div class="corner">DENLOGO</div>
  <section class="hero">
    <div class="mark" aria-hidden="true"><span class="d">D</span><span class="l">L</span></div>
    <div class="name">DENLOGO</div>
    <a class="cta" href="mailto:hello@denlogo.com">Get in touch <span class="arrow">→</span></a>
  </section>
</main>
</body>
</html>
